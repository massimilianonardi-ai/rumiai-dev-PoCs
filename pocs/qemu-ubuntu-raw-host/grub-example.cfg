# Experimental GRUB path for a nested minimal Ubuntu RAW host on MBOOTDATA.
# This is NOT wired into m-boot's production menu until boot-path tests pass.
# Source: preexisting boot_media_device, isopath, and GRUB loaded from ESP.
function boot_iso_with_ubuntu_qemu_host {
  set target_iso="$1"
  set host_image="/m/boot/host/mboot-ubuntu-host.raw"
  if [ ! -f "($boot_media_device)$host_image" ]
  then
    echo "Ubuntu QEMU RAW host not installed: $host_image"
    sleep --interruptible 15
    return 1
  fi
  if [ ! -f "($boot_media_device)$target_iso" ]
  then
    echo "Selected ISO not found: $target_iso"
    sleep --interruptible 15
    return 2
  fi
  if ! probe --set=source_uuid --fs-uuid "($boot_media_device)"
  then
    echo "Cannot determine the source filesystem UUID"
    return 3
  fi
  if ! loopback ubuntu_host "($boot_media_device)$host_image"
  then
    echo "Cannot open RAW disk image: $host_image"
    return 4
  fi
  if [ ! -f "(ubuntu_host,gpt1)/vmlinuz" ]
  then
    echo "Ubuntu host kernel missing from RAW GPT root partition"
    loopback --delete ubuntu_host
    return 5
  fi
  if [ ! -f "(ubuntu_host,gpt1)/initrd.img" ]
  then
    echo "Ubuntu host initramfs missing from RAW GPT root partition"
    loopback --delete ubuntu_host
    return 6
  fi
  echo "Starting native Ubuntu RAW host for $target_iso"
  linux (ubuntu_host,gpt1)/vmlinuz root=/dev/mboot-raw-root rw \
    mboot.raw="$host_image" mboot.iso="$target_iso" \
    mboot.media_uuid="$source_uuid" console=tty0 console=ttyS0
  initrd (ubuntu_host,gpt1)/initrd.img
  loopback --delete ubuntu_host
}
