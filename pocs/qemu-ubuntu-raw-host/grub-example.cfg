# Experimental GRUB path: kernel/initramfs are EXTERNAL to the RAW image.
# Not wired into m-boot's production menu; no boot-path PASS claimed.
# Requires preexisting boot_media_device and ISO path on ext4 MBOOTDATA.
#
# Copy one same-build bundle under /m/boot/host/{amd64,arm64}/:
#   mboot-ubuntu-host.raw, vmlinuz, initrd.img, kernel-release.txt
# A separately published SHA256 manifest binds these artifacts to one build.
function boot_iso_with_ubuntu_qemu_host {
  set target_iso="$1"
  if [ "$grub_cpu" = "arm64" ]
  then
    set host_arch="arm64"
  else
    if [ "$grub_cpu" = "x86_64" ]
    then
      set host_arch="amd64"
    else
      echo "Unsupported m-boot host architecture for Ubuntu RAW/QEMU: $grub_cpu"
      return 1
    fi
  fi
  set host_dir="/m/boot/host/$host_arch"
  set host_image="$host_dir/mboot-ubuntu-host.raw"
  set host_kernel="$host_dir/vmlinuz"
  set host_initrd="$host_dir/initrd.img"

  if [ ! -f "($boot_media_device)$host_image" ]
  then
    echo "Ubuntu QEMU RAW host not installed: $host_image"
    return 2
  fi
  if [ ! -f "($boot_media_device)$host_kernel" ]
  then
    echo "Matching external Ubuntu host kernel missing: $host_kernel"
    return 3
  fi
  if [ ! -f "($boot_media_device)$host_initrd" ]
  then
    echo "Matching external Ubuntu host initramfs missing: $host_initrd"
    return 4
  fi
  if [ ! -f "($boot_media_device)$target_iso" ]
  then
    echo "Selected ISO not found: $target_iso"
    return 5
  fi
  if ! probe --set=source_uuid --fs-uuid "($boot_media_device)"
  then
    echo "Cannot determine m-boot source filesystem UUID"
    return 6
  fi

  echo "Starting Ubuntu RAW host for $target_iso"
  linux "($boot_media_device)$host_kernel" root=/dev/mboot-raw-root rootfstype=ext4 rw \
    mboot.raw="$host_image" mboot.iso="$target_iso" mboot.media_uuid="$source_uuid" \
    console=tty0 console=ttyS0
  initrd "($boot_media_device)$host_initrd"
}
