name: PoC 065 - Google Closure Compiler and jsc imports
on:
  push:
    paths:
      - 'pocs/065-jsc-closure-imports/**'
      - '.github/workflows/poc-065-jsc-closure.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire pinned Closure Compiler explicitly for this PoC
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/closure-compiler.jar" \
            https://repo.maven.apache.org/maven2/com/google/javascript/closure-compiler/v20260831/closure-compiler-v20260831.jar
          java -jar "$RUNNER_TEMP/closure-compiler.jar" --version
      - name: Run V8 semantics and real Closure checks
        shell: bash
        env:
          CLOSURE_JAR: ${{ runner.temp }}/closure-compiler.jar
        run: |
          set -euo pipefail
          node pocs/065-jsc-closure-imports/probe.mjs
