name: PoC 068 m-context source evidence diagnostic

on:
  push:
    paths:
      - '.github/workflows/poc-068-m-context-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect trusted citation acquisition using real Chromium
        shell: bash
        env:
          SHARE_URL: https://chatgpt.com/share/6ae46210-ceac-83eb-bf52-09b707731aff
        run: |
          set -eu
          umask 077
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/private"
          cat > "$RUNNER_TEMP/bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/chromium"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          capture() {
            label="$1"
            shift
            for attempt in 1 2; do
              dir="$RUNNER_TEMP/private/$label-$attempt"
              status=0
              node render-probe.mjs "$SHARE_URL" "$dir" \
                --headless --sweep --observe-interactions "$@" \
                > "$RUNNER_TEMP/private/$label-$attempt.log" 2>&1 || status=$?
              if [ "$status" -eq 0 ]; then
                printf '%s' "$dir" > "$RUNNER_TEMP/private/$label.path"
                return 0
              fi
              if [ "$status" -ne 3 ]; then
                echo "Capture $label failed with code $status" >&2
                return "$status"
              fi
              echo "Capture $label not ready; isolated retry $attempt" >&2
            done
            return 3
          }
          capture original
          capture sources --probe-trusted-source-card-actions
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {captureSignatures} from './inspect-source-group-identity.mjs';
          import {collectTrustedSourceEvidence} from './inspect-trusted-source-evidence.mjs';
          const root=process.env.RUNNER_TEMP+'/private';
          const original=captureSignatures(fs.readFileSync(path.join(root,'original.path'),'utf8'))
          const expected=[];
          for(const [ordinal,entry] of original)
            for(const pill of entry.pills)
              expected.push({ordinal,index:pill.index,count:pill.count});
          const sourceDir=fs.readFileSync(path.join(root,'sources.path'),'utf8');
          const evidence=collectTrustedSourceEvidence([sourceDir]);
          const data=fs.readFileSync(path.join(sourceDir,'events.jsonl'),'utf8')
            .split('\n').filter(Boolean).map(JSON.parse);
          const attempts=data.filter(e=>e.kind==='interaction.trusted-source-card-intents')
            .map(e=>({
              ordinal:e.ordinal,index:e.groupIndex,count:e.expectedSources,
              cards:(e.attempts||[]).map(a=>({
                index:a.index,status:a.status,
                directIntents:(a.windowOpen||[]).length+(a.anchorClick||[]).length
              }))
            }));
          console.log(JSON.stringify({
            status:'private-safe-m-context-diagnostic',
            originalGroups:expected,
            observedGroups:evidence.groups.map(g=>({
              ordinal:g.ordinal,index:g.index,count:g.expectedSources,
              verifiedCards:g.verifiedCards,complete:g.complete
            })),
            dispatched:evidence.dispatched,
            ambiguousCards:evidence.ambiguousCards,
            attempts
          }));
          NODE
