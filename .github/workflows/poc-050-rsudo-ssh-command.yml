name: PoC 050 rsudo ssh-command

on:
  workflow_dispatch:
  push:
    paths:
      - 'pocs/050-rsudo-ssh-command/**'
      - '.github/workflows/poc-050-rsudo-ssh-command.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c33b39ded5020d85943ca826cedbe3ff6d2a4492
          path: rumiai-os

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 287577204412cef46cae83157547dbe9ac28d2f8
          path: rumiai-tests

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssh-client openssl expect gnupg

      - name: Make rootless Podman usable on hosted Ubuntu when needed
        run: |
          if ! podman info >/tmp/podman-info.log 2>&1; then
            cat /tmp/podman-info.log
            if sudo test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            fi
          fi
          podman info >/dev/null

      - name: Diagnose permanent rsudo tests directly
        shell: sh
        continue-on-error: true
        run: |
          set -u
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE/rumiai-os"
          cd rumiai-tests
          overall=0
          for test in tests/rumiai-os/rsudo/*.test
          do
            echo "===== $test ====="
            "$test"
            status=$?
            echo "status=$status"
            [ "$status" -eq 0 ] || overall=1
          done
          exit "$overall"

      - name: Run permanent rsudo regression group
        shell: sh
        continue-on-error: true
        run: |
          set -u
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE/rumiai-os"
          cd rumiai-tests
          ./rumiai-test rumiai-os/rsudo

      - name: Exercise current ssh-command implementation
        shell: sh
        run: |
          set -eu
          sh -n pocs/050-rsudo-ssh-command/run.sh
          pocs/050-rsudo-ssh-command/run.sh             pocs/047-testlab-rsudo-scenario-lifecycle/run.sh             "$GITHUB_WORKSPACE/rumiai-os"
