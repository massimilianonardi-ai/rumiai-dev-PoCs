name: PoC 068 Metadata Probe

on:
  push:
    paths:
      - '.github/workflows/poc-068-metadata-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-share-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run publication and metadata tests
        run: |
          set -eu
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund
          npm run check
          node --check render-probe.mjs
          node --check share-metadata.mjs
          node --check publish-chat-archive.mjs
          node --test tests/export-offline.test.mjs tests/share-metadata.test.mjs tests/publish-chat-archive.test.mjs
      - name: Fetch public share into private temporary file
        env:
          SHARE_URL: https://chatgpt.com/share/6ad1c0f5-7110-83eb-bc19-356d48fc1259
        run: |
          set -eu
          umask 077
          curl -fLsS --max-time 90 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' "$SHARE_URL" -o "$RUNNER_TEMP/share.html"
          echo "HTML_BYTES=$(wc -c < "$RUNNER_TEMP/share.html")"
      - name: Inspect metadata presence without leaking chat content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync(process.env.RUNNER_TEMP+'/share.html','utf8');
          const count=s=>(html.match(new RegExp(s,'gi'))||[]).length;
          const meta=[...html.matchAll(/<meta\s+[^>]*>/gi)].map(m=>m[0]).map(t=>{
            const key=t.match(/(?:name|property)\s*=\s*['"]([^'"]+)/i);
            return key?.[1]||'unlabeled';
          });
          const title=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||'';
          const og=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i)?.[1]||'';
          const chunks=[...html.matchAll(/streamController\.enqueue\(("(?:\\.|[^"\\])*")\)/g)]
            .map(m=>JSON.parse(m[1]));
          let values=[];
          try{values=JSON.parse(chunks.join('').split('\n')[0]);}catch{}

          const index=values.indexOf('linear_conversation');
          const refs=Array.isArray(values[index+1])?values[index+1]:[];
          const field=(entry,name)=>{
            if(!entry||Array.isArray(entry)||typeof entry!=='object')return undefined;
            for(const [k,v] of Object.entries(entry)){
              if(/^_\d+$/.test(k)&&values[Number(k.slice(1))]===name)return values[v];
            }
          };
          const messageDates=refs.slice(0,10).map(ref=>{
            const message=field(values[ref],'message');
            const role=field(field(message,'author'),'role');
            return {role:role||null,createTime:field(message,'create_time')??null,
              createdAt:field(message,'created_at')??null,
              timestamp:field(message,'timestamp')??null};
          });
          const adjacent=(key)=>values.flatMap((value,i)=>value===key?
            [{at:i,nextType:typeof values[i+1],nextNumeric:typeof values[i+1]==='number'?values[i+1]:null}]:[]);

          const report=({
            bytes:html.length,htmlTitle:title.slice(0,120),ogTitle:og.slice(0,120),
            messageDates,
            adjacent:{title:adjacent('title').slice(0,10),createTime:adjacent('create_time').slice(0,10),
              createdAt:adjacent('created_at').slice(0,10),linearConversation:adjacent('linear_conversation').slice(0,3)},
            hasDocumentTitle:title.length>0,
            titleLength:title.length,titleGeneric:/ChatGPT|OpenAI/i.test(title),
            metaKeys:[...new Set(meta)].slice(0,32),
            hasOgTitle:meta.includes('og:title'),hasDescription:meta.includes('description'),
            markers:{linearConversation:count('linear_conversation'),
              createTime:count('create_time'),createdAt:count('created_at'),
              shareTitle:count('conversation_title'),turboStream:count('streamController')}
          });
          fs.writeFileSync('metadata-probe-result.json',JSON.stringify(report,null,2)+'\n');
          const {extractChatMetadata}=await import('./pocs/068-chatgpt-shared-link-export/share-metadata.mjs');
          const parsed=extractChatMetadata(html);
          if(parsed.title!=='Integrare Chat e Work'||parsed.date!=='2026-10-08')
            throw Error('Unexpected original title or first-message date');
          report.verifiedOriginalMetadata={title:parsed.title,date:parsed.date};
          report.testStatus='pass';
          fs.writeFileSync('metadata-probe-result.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Real Chromium export and captured-document metadata check
        id: integrated
        continue-on-error: true
        shell: bash
        env:
          SHARE_URL: https://chatgpt.com/share/6ad1c0f5-7110-83eb-bc19-356d48fc1259
        run: |
          set -eu
          umask 077
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/poc068-bin" "$RUNNER_TEMP/poc068-export"
          cat > "$RUNNER_TEMP/poc068-bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/poc068-bin/chromium"
          export PATH="$RUNNER_TEMP/poc068-bin:$PATH"
          cd pocs/068-chatgpt-shared-link-export
          node export-offline.mjs "$SHARE_URL" "$RUNNER_TEMP/poc068-export/final" --with-metadata \
            > "$RUNNER_TEMP/poc068-export/result.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP,'poc068-export/result.json'),'utf8'));
          assert.equal(report.status,'private-offline-export-created');
          assert.equal(report.originalScriptsDisabled,true);
          assert.equal(report.remoteImages,0);
          const original=report.metadata;
          assert.ok(original);
          assert.deepEqual({title:original.title,date:original.date},{
            title:'Integrare Chat e Work',date:'2026-10-08'});
          const out=JSON.parse(fs.readFileSync('../../metadata-probe-result.json','utf8'));
          out.capturedOriginalHtmlMetadata='pass';
          out.integratedRealChromeExport='pass';
          fs.writeFileSync('../../metadata-probe-result.json',
            JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({
            status:'integrated-chrome-export-metadata-pass',
            originalDate:original.date,
            titleRecovered:true,
            groups:report.restoredGroups,
            singletonLinks:report.singletonLinks
          }));
          NODE
      - name: Record integrated Chromium outcome without private payloads
        if: always()
        env:
          INTEGRATED_OUTCOME: ${{ steps.integrated.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const name='metadata-probe-result.json';
          const report=JSON.parse(fs.readFileSync(name,'utf8'));
          report.integratedStageOutcome=process.env.INTEGRATED_OUTCOME;
          fs.writeFileSync(name,JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Publish metadata presence result only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --ff-only origin/main
          git add metadata-probe-result.json
          git commit -m 'test(poc-068): record sanitized share metadata probe'
          git push origin HEAD:main
      - name: Fail CI if the integrated Chromium check failed
        if: steps.integrated.outcome != 'success'
        run: exit 1
