name: PoC 066 TextEdit and Document2D browser GUI

on:
  push:
    paths:
      - 'pocs/066-text-edit-browser-gui/**'
      - '.github/workflows/poc-066-text-edit-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out real TextEdit 0.8.2 and current m.text.document
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c453b5764fec8403571125ea62107ae072a823a1
          path: rumiai-os
      - name: Check out GUI PoC at its actual nested path
        uses: actions/checkout@v4
        with:
          path: rumiai-os/src/rumiai-dev-PoCs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up headless browser driver
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Compile the actual Document2D core as a browser script
        run: |
          node rumiai-os/lib/sys/js/jsc.lib.js rumiai-os/lib/sys/js/core/modules-js.json rumiai-os/lib/sys/js/core/document2d-browser.generated.js
          node --check rumiai-os/lib/sys/js/core/document2d-browser.generated.js
      - name: Verify PoC source syntax
        run: |
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/gui.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/document2d.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation-transport.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-contract.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-compact.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/document2d-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/region-geometry.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions-headless.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/regions.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions.mjs
      - name: Run DOM-independent 2D region tests against actual TextEdit
        run: |
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions-headless.mjs
      - name: Run actual Chromium mouse and keyboard scenario
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory rumiai-os >/tmp/text-edit-gui-http.log 2>&1 &
          sleep 2
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/document2d-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-contract.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-compact.mjs
