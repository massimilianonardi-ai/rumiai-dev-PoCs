name: PoC 066 TextEdit and Document2D browser GUI

on:
  push:
    paths:
      - 'pocs/066-text-edit-browser-gui/**'
      - '.github/workflows/poc-066-text-edit-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out real TextEdit 0.8.2 and current m.text.document
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c453b5764fec8403571125ea62107ae072a823a1
          path: rumiai-os
      - name: Check out GUI PoC at its actual nested path
        uses: actions/checkout@v4
        with:
          path: rumiai-os/src/rumiai-dev-PoCs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up headless browser driver
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Compile the actual Document2D core as a browser script
        run: |
          node rumiai-os/lib/sys/js/jsc.lib.js rumiai-os/lib/sys/js/core/modules-js.json rumiai-os/lib/sys/js/core/document2d-browser.generated.js
          node --check rumiai-os/lib/sys/js/core/document2d-browser.generated.js
      - name: Verify PoC source syntax
        run: |
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/gui.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/document2d.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/canonical-gui.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/canonical-region-renderer.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation-transport.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation-direct.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-direct.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-sparse.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-gui-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-interaction-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-protected-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-viewport-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-parity-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/browser-launch.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/g07-physical-browser.mjs
          sh -n rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/g07-ubuntu-arm64.sh
          sh -n rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/g07-ubuntu-x86_64.sh
          sh -n rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/show-canonical-gui.sh
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-contract.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-compact.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/grapheme-stream.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/prepare-grapheme-candidate.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/prepare-cell-packed-candidate.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-bounded-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/presentation-bounded.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/grapheme-candidate-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/document2d-browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/browser.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/region-geometry.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions-headless.mjs
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/regions.js
          node --check rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions.mjs
      - name: Verify G07 Ubuntu ARM64 reference VM launcher rejects x64 guest
        run: |
          set +e
          sh rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/g07-ubuntu-arm64.sh >/tmp/rumiai-g07-aux.log 2>&1
          status=$?
          set -e
          test "$status" -eq 11
          grep -q 'G07 BLOCKED' /tmp/rumiai-g07-aux.log
      - name: Verify G07 x86_64 launcher reaches original Chromium diagnostics on Ubuntu 24.04
        run: |
          set +e
          RUMIAI_G07_CHROMIUM=/usr/bin/false sh rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/g07-ubuntu-x86_64.sh >/tmp/rumiai-g07-x86-smoke.log 2>&1
          status=$?
          set -e
          test "$status" -eq 16
          grep -q 'G07 Chromium version probe failed' /tmp/rumiai-g07-x86-smoke.log
          grep -q 'executable=/usr/bin/false exit=1' /tmp/rumiai-g07-x86-smoke.log
      - name: Smoke-test interactive GUI manual launcher and actual HTML
        run: |
          set -eu
          script=rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/show-canonical-gui.sh
          RUMIAI_TEXTEDIT_DEMO_PORT=8767 sh "$script" >"$RUNNER_TEMP/textedit-manual-demo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          ready=0
          for attempt in $(seq 1 90)
          do
            if grep -q 'GUI interattiva TextEdit pronta:' "$RUNNER_TEMP/textedit-manual-demo.log"
            then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null
            then
              cat "$RUNNER_TEMP/textedit-manual-demo.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]
          then
            cat "$RUNNER_TEMP/textedit-manual-demo.log"
            exit 1
          fi
          python3 - <<'PY'
          from urllib.request import urlopen
          base = 'http://127.0.0.1:8767'
          html = '/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/canonical-gui.html'
          core = '/lib/sys/js/core/document2d-browser.generated.js'
          with urlopen(base + html, timeout=5) as response:
              assert response.status == 200
              assert b'canonical-gui.js' in response.read()
          with urlopen(base + core, timeout=5) as response:
              assert response.status == 200
              assert b'RawDocument2D' in response.read()
          print('PASS: interactive GUI launcher serves actual compiled Document2D and GUI')
          PY
      - name: Check standalone candidate UTF-16 streaming carry (PoC only)
        run: |
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/grapheme-stream.mjs
      - name: Run DOM-independent 2D region tests against actual TextEdit
        run: |
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions-headless.mjs
      - name: Run actual Chromium mouse and keyboard scenario
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory rumiai-os >/tmp/text-edit-gui-http.log 2>&1 &
          sleep 2
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/regions.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/document2d-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-gui-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-interaction-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-protected-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-viewport-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/canonical-parity-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-contract.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-compact.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-direct.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-sparse.mjs
      - name: Compile isolated patched real Cell core (experimental only)
        run: |
          cp -R rumiai-os/lib/sys/js/core "$RUNNER_TEMP/text-edit-candidate-core"
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/prepare-grapheme-candidate.mjs "$RUNNER_TEMP/text-edit-candidate-core/m/text/document/CellDocument2D.js"
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/prepare-cell-packed-candidate.mjs "$RUNNER_TEMP/text-edit-candidate-core/m/text/document/CellDocument2D.js"
          node rumiai-os/lib/sys/js/jsc.lib.js "$RUNNER_TEMP/text-edit-candidate-core/modules-js.json" rumiai-os/lib/sys/js/core/document2d-candidate.generated.js
          node --check rumiai-os/lib/sys/js/core/document2d-candidate.generated.js
      - name: Test experimental compiled Cell composition in Chromium
        run: |
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/grapheme-candidate-browser.mjs
          node rumiai-os/src/rumiai-dev-PoCs/pocs/066-text-edit-browser-gui/tests/presentation-bounded-browser.mjs
