name: PoC 058 original evidence one-time recovery

on:
  push:
    paths:
      - .github/workflows/poc-058-recover-original-artifact.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and promote exact recovered JSON to a Git blob (no ref update)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/blobs/f112684c322cc3df178391e39e8c9128e9b6729c" > recovered-gzip-blob.json
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          blob = json.loads(pathlib.Path('recovered-gzip-blob.json').read_text())
          packed = base64.b64decode(blob['content'])
          original = gzip.decompress(packed)
          digest = hashlib.sha256(original).hexdigest()
          assert digest == '319e4c1df7f23cb1f34c51b7a97d8f7ecb3d2d4a3326a4275c33f7bdecc74908'
          doc = json.loads(original)
          assert doc['engine'] == 'ngspice'
          assert doc['seeds'] == [11, 29, 47] and len(doc['results']) == 24
          payload = {'content': base64.b64encode(original).decode(), 'encoding':'base64'}
          pathlib.Path('original-blob-upload.json').write_text(json.dumps(payload))
          print('VERIFIED_ORIGINAL_JSON_SHA256=' + digest)
          print('VERIFIED_ORIGINAL_JSON_BYTES=' + str(len(original)))
          PY
          sha="$(gh api -X POST "repos/${{ github.repository }}/git/blobs" --input original-blob-upload.json --jq '.sha')"
          echo "ORIGINAL_PLAINTEXT_GIT_BLOB_SHA=${sha}"
