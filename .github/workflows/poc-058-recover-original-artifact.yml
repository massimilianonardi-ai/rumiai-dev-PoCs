name: PoC 058 original evidence one-time recovery

on:
  push:
    paths:
      - .github/workflows/poc-058-recover-original-artifact.yml

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover original results.json without altering historical evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/11539771228/zip" > original.zip
          printf '%s  %s\n' \
            '36dceff7e60c2ab446130b0a8fb07ccdbde4d9e8ecf152e382f146fcd89df999' \
            original.zip | sha256sum --check
          unzip -p original.zip results.json > original-results.json
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, textwrap
          blob = pathlib.Path('original-results.json').read_bytes()
          doc = json.loads(blob)
          assert doc['engine'] == 'ngspice'
          assert doc['seeds'] == [11, 29, 47]
          assert len(doc['results']) == 24
          print('RESULTS_JSON_SHA256=' + hashlib.sha256(blob).hexdigest())
          print('RESULTS_JSON_BYTES=' + str(len(blob)))
          print('BEGIN_POC_058_JSON_GZIP_B64')
          encoded = base64.b64encode(gzip.compress(blob, compresslevel=9, mtime=0)).decode()
          for chunk in textwrap.wrap(encoded, 1000):
              print(chunk)
          print('END_POC_058_JSON_GZIP_B64')
          PY
