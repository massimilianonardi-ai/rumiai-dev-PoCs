name: PoC 068 Codex shared-snapshot shape

on:
  push:
    paths:
      - '.github/workflows/poc-068-codex-share-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public Codex share in real Chrome without publishing its content
        shell: bash
        env:
          CODEX_URL: https://chatgpt.com/s/cx_6ae86b0755a08191a57b79dc77833361
        run: |
          set -eu
          umask 077
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund >/dev/null
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "Browser: $("$browser" --version)"
          set +e
          curl --location --fail --silent --show-error --max-time 45 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' \
            "$CODEX_URL" > "$RUNNER_TEMP/codex-static.html" 2> "$RUNNER_TEMP/codex-curl-error.log"
          curl_status=$?
          timeout 75 "$browser" --headless=new --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --disable-extensions \
            --user-data-dir="$RUNNER_TEMP/codex-probe-profile" \
            --virtual-time-budget=18000 --dump-dom "$CODEX_URL" \
            > "$RUNNER_TEMP/codex-rendered.html" 2> "$RUNNER_TEMP/codex-chrome-error.log"
          chrome_status=$?
          set -e
          export CODEX_CURL_STATUS="$curl_status" CODEX_CHROME_STATUS="$chrome_status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {parseHTML} from 'linkedom';
          const root=process.env.RUNNER_TEMP;
          const report={status:'codex-share-private-safe-structure',curlExit:Number(process.env.CODEX_CURL_STATUS),
            chromeExit:Number(process.env.CODEX_CHROME_STATUS)};
          for(const kind of ['static','rendered']){
            const html=fs.readFileSync(path.join(root,'codex-'+kind+'.html'),'utf8');
            const {document}=parseHTML(html);
            const q=selector=>document.querySelectorAll(selector).length;
            const meta=[...document.querySelectorAll('meta[name],meta[property]')]
              .map(e=>e.getAttribute('name')||e.getAttribute('property'))
              .filter(x=>x&&/^[a-z0-9:._-]{1,65}$/i.test(x));
            const markers=Object.fromEntries(['__NEXT_DATA__','streamController.enqueue',
              'linear_conversation','codex','snapshot','turn','message','data-testid',
              'datetime','<main','<article'].map(k=>[k,html.split(k).length-1]));
            const attrs=new Map();
            for(const el of document.querySelectorAll('main *,article *')){
              for(const a of el.getAttributeNames?.()||[])
                if(a.startsWith('data-')&&/^[a-z0-9-]{1,55}$/.test(a))
                  attrs.set(a,(attrs.get(a)||0)+1);
            }
            const n=selector=>q(selector);
            report[kind]={bytes:html.length,
              titleLength:(document.querySelector('title')?.textContent||'').length,
              genericTitle:/^(chatgpt|openai|codex)(\s|$)/i.test((document.querySelector('title')?.textContent||'').trim()),
              metas:[...new Set(meta)].sort().slice(0,36),
              counts:{main:n('main'),article:n('article'),heading:n('h1,h2,h3'),
                time:n('time'),datetime:n('[datetime]'),content:n('[data-message-id]'),
                turns:n('[data-turn-id-container]'),testids:n('[data-testid]'),
                code:n('code'),pre:n('pre'),img:n('img'),linkCss:n('link[rel="stylesheet"]'),
                script:n('script'),paragraph:n('p'),button:n('button'),markdown:n('.markdown'),
                roleLog:n('[role="log"]'),roleArticle:n('[role="article"]')},
              dataAttrs:[...attrs.entries()].sort((a,b)=>b[1]-a[1]).slice(0,28),
              markers};
          }
          console.log(JSON.stringify(report,null,2));
          NODE
          rm -rf "$RUNNER_TEMP/codex-probe-profile" \
            "$RUNNER_TEMP/codex-static.html" "$RUNNER_TEMP/codex-rendered.html" \
            "$RUNNER_TEMP/codex-curl-error.log" "$RUNNER_TEMP/codex-chrome-error.log"
