name: PoC 068 macOS dev image evidence diagnostic

on:
  push:
    paths:
      - '.github/workflows/poc-068-macos-image-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real share export and classify missing image evidence privately
        env:
          SHARE_URL: https://chatgpt.com/share/6ae4dde6-93a0-83ed-820e-74d0e3f3c9e1
        run: |
          set -eu
          umask 077
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/localize-exact-captured-images.test.mjs tests/localize-first-party-images.test.mjs tests/recover-google-favicons.test.mjs tests/export-offline.test.mjs
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/private"
          cat > "$RUNNER_TEMP/bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/chromium"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          status=0
          node export-offline.mjs "$SHARE_URL" "$RUNNER_TEMP/private/final" \
            > "$RUNNER_TEMP/private/result.json" 2> "$RUNNER_TEMP/private/diagnostics.log" || status=$?
          export EXPORT_STATUS="$status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {parseHTML} from 'linkedom';
          import {captureImageIndex} from './inspect-offline-control-provenance.mjs';
          const home=path.join(process.env.RUNNER_TEMP,'private');
          const stages=fs.readdirSync(home).filter(name=>name.startsWith('.poc068-export-'));
          const stage=stages.length===1?path.join(home,stages[0]):null;
          const styled=stage&&path.join(stage,'styled','index.html');
          const captures=stage?fs.readdirSync(stage)
            .filter(name=>name==='original'||name.startsWith('more-images'))
            .map(name=>path.join(stage,name))
            .filter(dir=>fs.existsSync(path.join(dir,'events.jsonl'))):[];
          const classify=url=>{
            const h=url.hostname;
            if(h==='chatgpt.com')return 'chatgpt-origin';
            if(h==='www.google.com'||h.endsWith('.google.com'))return 'google';
            if(h==='gstatic.com'||h.endsWith('.gstatic.com'))return 'gstatic';
            if(h==='googleusercontent.com'||h.endsWith('.googleusercontent.com'))return 'googleusercontent';
            if(h==='oaiusercontent.com'||h.endsWith('.oaiusercontent.com'))return 'oaiusercontent';
            if(h==='openai.com'||h.endsWith('.openai.com'))return 'openai-origin';
            if(h==='githubusercontent.com'||h.endsWith('.githubusercontent.com'))return 'githubusercontent';
            if(h==='github.com'||h.endsWith('.github.com'))return 'github';
            if(h==='cdn.jsdelivr.net')return 'jsdelivr';
            if(h==='favicon.ico'||h.endsWith('.favicon.ico'))return 'favicon-service';
            return 'other-origin';
          };
          const results={captureRuns:captures.length,exportExit:Number(process.env.EXPORT_STATUS)};
          if(styled&&fs.existsSync(styled)){
            const index=captureImageIndex(captures);
            const {document}=parseHTML(fs.readFileSync(styled,'utf8'));
            const totals={},missingPaths={},missingUrls=new Set();
            for(const node of document.querySelectorAll('img[src]')){
              const raw=node.getAttribute('src');
              try{
                const url=new URL(raw.replace(/&amp;/g,'&'));
                if(url.protocol!=='https:')continue;
                url.hash='';
                const found=index.byUrl.has(url.href);
                const key=classify(url)+':'+(found?'verified':'missing');
                totals[key]=(totals[key]||0)+1;
                if(!found){
                  missingUrls.add(url.href);
                  const shape=url.pathname==='/s2/favicons'?'google-s2':url.pathname.startsWith('/s2/')?'google-other-s2':'other-path';
                  missingPaths[shape]=(missingPaths[shape]||0)+1;
                }
              }catch{}
            }
            results.imageReferences=totals;
            results.uniqueMissingUrls=missingUrls.size;
            results.missingImagePaths=missingPaths;
            results.conflictingImageReferences=[...document.querySelectorAll('img[src]')]
              .filter(node=>{
                try{
                  const u=new URL(node.getAttribute('src').replace(/&amp;/g,'&'));
                  u.hash='';
                  return index.conflictingUrls.has(u.href);
                }catch{return false;}
              }).length;
            results.verifiedBodies=index.verifiedBodies;
            results.conflicts=index.conflicts;
            results.captureImageStatuses={};
            results.unmatchedChromeResponses={};
            for(const dir of captures){
              for(const line of fs.readFileSync(path.join(dir,'events.jsonl'),'utf8').split(/\r?\n/).filter(Boolean)){
                const event=JSON.parse(line);
                if(event.kind==='network.image-response'){
                  const urls=[event.initialUrl,event.requestUrl,event.responseUrl]
                    .filter(Boolean).map(raw=>{
                      try{const url=new URL(raw);url.hash='';return url.href;}
                      catch{return null;}
                    });
                  if(urls.some(url=>missingUrls.has(url))){
                    const key=String(event.status||'unknown')+':'+
                      String(event.mimeType||'unknown').toLowerCase();
                    results.unmatchedChromeResponses[key]=
                      (results.unmatchedChromeResponses[key]||0)+1;
                  }
                }
                if(event.kind!=='network.image-body')continue;
                const status=event.status||'unspecified';
                results.captureImageStatuses[status]=(results.captureImageStatuses[status]||0)+1;
              }
            }
          }
          const log=fs.readFileSync(path.join(home,'diagnostics.log'),'utf8');
          const permittedErrors=[
            'Unmatched non-Google remote image reference',
            'Google favicon returned unsupported image MIME',
            'Google favicon bytes do not match image signature',
            'Exact Google favicon URL was not retrievable',
            'Google favicon redirected outside approved image endpoints',
            'Google favicon redirect has no target',
            'Google favicon exceeded bounded redirect count',
            'Google favicon body unavailable or too large',
            'Google favicon exceeds size limit',
            'Conflicting or invalid original image capture evidence',
            'No bounded missing Google favicon set to recover',
            'Recovered Google icon evidence failed SHA verification',
            'Unmatched remote image reference in archive'
          ];
          results.safeRecoveryError=permittedErrors.find(msg=>
            log.includes('[offline-export] '+msg))||null;
          const http=log.match(/\[offline-export\] Exact Google favicon returned HTTP (\d{3})/u);
          results.googleRecoveryHttpStatus=http?Number(http[1]):null;
          results.googleRecoveryUrlMismatch=log.includes(
            'Google favicon response URL changed outside approved redirects');
          // No source URLs, query tokens, conversation text, browser profiles or raw HTML.
          console.log('PRIVATE-SAFE-IMAGE-EVIDENCE '+JSON.stringify(results));
          NODE
          if [ "$status" -ne 0 ]; then
            echo "Export not published; private evidence stayed on this disposable runner" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/private/final/index.html"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {inspectOfflineLinkControls} from './inspect-offline-link-controls.mjs';
          const audit=inspectOfflineLinkControls(
            process.env.RUNNER_TEMP+'/private/final');
          assert.equal(audit.hasScriptBlocking,true);
          assert.equal(audit.imageReferences.remote||0,0);
          assert.equal(audit.imageReferences.absolute||0,0);
          assert.equal(audit.imageReferences['local-missing']||0,0);
          console.log('MACOS-EXPORT-VERIFIED '+JSON.stringify({
            status:'success',scriptBlocked:true,remoteImages:0}));
          NODE
