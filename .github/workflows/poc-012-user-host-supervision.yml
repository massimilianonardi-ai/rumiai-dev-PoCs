name: poc-012-user-host-supervision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/poc-012-user-host-supervision.yml
      - pocs/012-user-host-supervision/**
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run host-supervision probe
        shell: bash
        run: |
          chmod +x pocs/012-user-host-supervision/tests/run
          pocs/012-user-host-supervision/tests/run
