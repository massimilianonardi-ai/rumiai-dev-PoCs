name: PoC 063 m.Class benchmark

on:
  pull_request:
    paths:
      - 'pocs/063-m-class-native-benchmark/**'
      - '.github/workflows/poc-063-m-class-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout experimental benchmark
        uses: actions/checkout@v4
      - name: Fetch and verify pinned upstream Class.js
        shell: sh
        run: |
          mkdir -p upstream-m/js/lib/js/m
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/massimilianonardi-ai/m/2a57a29880c2d7a32e18782122062c695fcb1a3a/js/lib/js/m/Class.js \
            --output upstream-m/js/lib/js/m/Class.js
          test "$(git hash-object upstream-m/js/lib/js/m/Class.js)" = 1ecebdd88adb7b420f0d9cdfd2f752d3df510e92
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record environment and upstream revision
        shell: sh
        run: |
          node --version
          node --print "process.versions.v8"
          git hash-object upstream-m/js/lib/js/m/Class.js
          wc -c upstream-m/js/lib/js/m/Class.js
      - name: Run actual benchmark and memory stress
        shell: sh
        run: |
          node --expose-gc pocs/063-m-class-native-benchmark/tests/benchmark.mjs \
            --class-file upstream-m/js/lib/js/m/Class.js \
            --output benchmark-results-node-${{ matrix.node }}.json
      - name: Diagnose inherited-instance heap and object shapes
        shell: sh
        run: |
          node --expose-gc --allow-natives-syntax \
            pocs/063-m-class-native-benchmark/tests/diagnose.mjs \
            upstream-m/js/lib/js/m/Class.js
      - name: Save benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-063-benchmark-node-${{ matrix.node }}
          path: benchmark-results-node-${{ matrix.node }}.json
          if-no-files-found: warn
          retention-days: 30
