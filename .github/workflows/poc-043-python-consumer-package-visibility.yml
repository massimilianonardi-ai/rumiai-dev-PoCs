name: PoC 043 Python consumer package visibility

on:
  workflow_dispatch:
  push:
    paths:
      - pocs/043-python-consumer-package-visibility/**
      - .github/workflows/poc-043-python-consumer-package-visibility.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 51d0cba5696a94caaf5ae39e2e476a31598a0ae1
          path: rumiai-os
      - name: Run PoC
        shell: bash
        run: |
          set -o pipefail
          ./pocs/043-python-consumer-package-visibility/run.sh "$GITHUB_WORKSPACE/rumiai-os" | tee poc-043-linux.log

  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 51d0cba5696a94caaf5ae39e2e476a31598a0ae1
          path: rumiai-os
      - name: Run PoC
        shell: bash
        run: |
          set -o pipefail
          ./pocs/043-python-consumer-package-visibility/run.sh "$GITHUB_WORKSPACE/rumiai-os" | tee poc-043-macos.log
