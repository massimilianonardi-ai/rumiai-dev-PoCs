name: PoC 068 computer use capture-mode diagnostic

on:
  push:
    paths:
      - '.github/workflows/poc-068-computer-use-readiness.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare read-only browser sweep capture modes
        shell: bash
        env:
          TARGET_SHARE_URL: https://chatgpt.com/share/6ae59b8c-0420-83eb-83d7-247543f80b34
        run: |
          set -eu
          umask 077
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund
          node --check render-probe.mjs
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/poc068-bin" "$RUNNER_TEMP/private"
          cat > "$RUNNER_TEMP/poc068-bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/poc068-bin/chromium"
          export PATH="$RUNNER_TEMP/poc068-bin:$PATH"
          for mode in baseline media full; do
            status=0
            set -- --headless --sweep
            if [ "$mode" = media ] || [ "$mode" = full ]; then
              set -- "$@" --capture-static-bodies --capture-image-bodies
            fi
            if [ "$mode" = full ]; then
              set -- "$@" --observe-interactions
            fi
            timeout --signal=INT --kill-after=5s 85s \
              node render-probe.mjs "$TARGET_SHARE_URL" \
              "$RUNNER_TEMP/private/$mode" "$@" \
              > "$RUNNER_TEMP/private/$mode.stdout" \
              2> "$RUNNER_TEMP/private/$mode.stderr" || status=$?
            printf '%s' "$status" > "$RUNNER_TEMP/private/$mode.status"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import readline from 'node:readline';
          const privateDir=path.join(process.env.RUNNER_TEMP,'private');
          const modes=['baseline','media','full'];
          const selected=[
            'session.ready','navigation.result','navigation.command-failed',
            'probe.installed','probe.instrumentation-failed',
            'turn.initial','turn.snapshot','turn.unidentified-snapshot',
            'sweep.started','sweep.step','sweep.finished','sweep.timeout',
            'sweep.not-ready','browser.startup-failed','dom.mutation'
          ];
          for(const mode of modes){
            const events=Object.fromEntries(selected.map(kind=>[kind,0]));
            const file=path.join(privateDir,mode,'events.jsonl');
            let summary=null;
            if(fs.existsSync(file)){
              const input=fs.createReadStream(file,{encoding:'utf8'});
              for await(const line of readline.createInterface({input})){
                if(!line.trim())continue;
                const event=JSON.parse(line);
                if(Object.hasOwn(events,event.kind))events[event.kind]++;
                if(event.kind==='sweep.not-ready'){
                  const shape=event.pageShape||{};
                  summary={
                    readyState:['loading','interactive','complete']
                      .includes(shape.readyState)?shape.readyState:null,
                    hasScrollRoot:shape.hasScrollRoot===true,
                    turnWrappers:Number.isInteger(shape.turnWrappers)?
                      shape.turnWrappers:null,
                    conversationMarkers:Number.isInteger(shape.conversationMarkers)?
                      shape.conversationMarkers:null,
                    mainElements:Number.isInteger(shape.mainElements)?
                      shape.mainElements:null
                  };
                }
              }
            }
            const code=Number(fs.readFileSync(
              path.join(privateDir,mode+'.status'),'utf8'));
            console.log('PRIVATE-SAFE-CAPTURE-MODE '+JSON.stringify({
              mode,exitCode:code,counts:events,notReadyShape:summary
            }));
          }
          NODE
