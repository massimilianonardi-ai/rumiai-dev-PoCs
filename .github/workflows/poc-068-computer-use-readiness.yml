name: PoC 068 computer use long-sweep acceptance

on:
  push:
    paths:
      - '.github/workflows/poc-068-computer-use-readiness.yml'
      - 'pocs/068-chatgpt-shared-link-export/render-probe.mjs'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise the real offline exporter on computer use share
        shell: bash
        env:
          TARGET_SHARE_URL: https://chatgpt.com/share/6ae59b8c-0420-83eb-83d7-247543f80b34
        run: |
          set -eu
          umask 077
          cd pocs/068-chatgpt-shared-link-export
          npm ci --no-audit --no-fund
          npm run check
          node --check render-probe.mjs
          node --test tests/export-offline.test.mjs tests/omit-external-link-icons.test.mjs
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/private"
          cat > "$RUNNER_TEMP/bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/chromium"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          status=0
          node export-offline.mjs "$TARGET_SHARE_URL" "$RUNNER_TEMP/private/archive" \
            --with-metadata --keep-evidence \
            > "$RUNNER_TEMP/private/result.json" \
            2> "$RUNNER_TEMP/private/diagnostic.log" || status=$?
          export EXPORT_STATUS="$status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir=path.join(process.env.RUNNER_TEMP,'private');
          const resultFile=path.join(dir,'result.json');
          const result=Number(process.env.EXPORT_STATUS)===0?
            JSON.parse(fs.readFileSync(resultFile,'utf8')):null;
          const log=fs.readFileSync(path.join(dir,'diagnostic.log'),'utf8');
          const stages=fs.readdirSync(dir).filter(n=>n.startsWith('.poc068-export-'));
          const evidence=stages.length===1?path.join(dir,stages[0],'original','events.jsonl'):null;
          const counts={};
          const ids=new Set(),captured=new Set();
          if(evidence&&fs.existsSync(evidence))
            for(const line of fs.readFileSync(evidence,'utf8').split(/\r?\n/u).filter(Boolean)){
              const e=JSON.parse(line);
              if(['turn.initial','turn.snapshot','sweep.started','sweep.finished',
                  'sweep.timeout','sweep.not-ready','sweep.browser-disconnected']
                .includes(e.kind))counts[e.kind]=(counts[e.kind]||0)+1;
              if(e.kind==='turn.initial'&&typeof e.turnId==='string')ids.add(e.turnId);
              if(e.kind==='turn.snapshot'&&typeof e.turnId==='string')captured.add(e.turnId);
            }
          let renderedTurns=null,missingOrdinals=null;
          if(result){
            const audit=JSON.parse(fs.readFileSync(
              path.join(dir,'archive','audit.json'),'utf8'));
            renderedTurns=Array.isArray(audit.turns)?audit.turns.length:null;
            missingOrdinals=Array.isArray(audit.missingOrdinals)?
              audit.missingOrdinals.length:null;
          }
          const knownErrors=['Chromium capture original failed with exit 5',
            'Chromium capture original failed with exit 6',
            'Chromium capture original-readiness-retry failed with exit 3',
            'Unmatched remote image reference in archive',
            'Missing original CSS',
            'Incomplete conversation sweep'];
          console.log('PRIVATE-SAFE-LONG-SWEEP '+JSON.stringify({
            exportExit:Number(process.env.EXPORT_STATUS),
            counters:counts,observedWrappers:ids.size,
            capturedWrappers:captured.size,
            renderedTurns,missingOrdinals,
            remoteImages:result?.remoteImages??null,
            scriptBlocked:result?.originalScriptsDisabled??null,
            classifiedError:knownErrors.find(x=>log.includes(x))||null
          }));
          NODE
          test "$status" -eq 0
