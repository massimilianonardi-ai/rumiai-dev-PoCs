name: mk provider incremental PoC

on:
  push:
    paths:
      - '.github/workflows/mk-provider-incremental-poc.yml'
  workflow_dispatch:

jobs:
  poc029:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: 42a172e234dd6bce71393519806658f3aac85862
          path: rumiai-dev-PoCs

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 48bd93440ef78b809b6b952429cc4f8b9ea7a523
          path: rumiai-os

      - name: Run PoC 029
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/029-mk-provider-incremental/tests/run.js
