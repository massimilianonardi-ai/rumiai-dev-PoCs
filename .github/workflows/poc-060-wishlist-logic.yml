name: PoC 060 synthetic wishlist control

on:
  push:
    branches: [main]
    paths:
      - pocs/060-amazon-wishlist-web-control/**
      - .github/workflows/poc-060-wishlist-logic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PoC parser
        working-directory: pocs/060-amazon-wishlist-web-control
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          for file in pocs/060-amazon-wishlist-web-control/*.mjs; do
            node --check "$file"
          done
      - name: Exercise synthetic contract and decision tests
        run: |
          cd pocs/060-amazon-wishlist-web-control
          node test-probe.mjs
          node test-api.mjs
          node test-price-monitor.mjs
          node test-adapters.mjs
          node test-coordinator.mjs
