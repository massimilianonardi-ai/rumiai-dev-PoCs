name: PoC 044 Python wheel compatibility dimensions

on:
  workflow_dispatch:
  push:
    paths:
      - pocs/044-python-wheel-compatibility/**
      - .github/workflows/poc-044-python-wheel-compatibility.yml
      - pocs/038-python-environment-late-binding/materialize-wheel.py

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: python-a
        shell: bash
        run: echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: python-b
        shell: bash
        run: echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
      - name: Run PoC
        shell: bash
        env:
          PYTHON_A: ${{ steps.python-a.outputs.path }}
          PYTHON_B: ${{ steps.python-b.outputs.path }}
        run: |
          set -o pipefail
          sh ./pocs/044-python-wheel-compatibility/run.sh | tee poc-044-linux.log

  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: python-a
        shell: bash
        run: echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: python-b
        shell: bash
        run: echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
      - name: Run PoC
        shell: bash
        env:
          PYTHON_A: ${{ steps.python-a.outputs.path }}
          PYTHON_B: ${{ steps.python-b.outputs.path }}
        run: |
          set -o pipefail
          sh ./pocs/044-python-wheel-compatibility/run.sh | tee poc-044-macos.log
