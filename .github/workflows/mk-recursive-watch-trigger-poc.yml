name: mk recursive watch trigger PoC

on:
  push:
    paths:
      - '.github/workflows/mk-recursive-watch-trigger-poc.yml'
  workflow_dispatch:

jobs:
  poc024:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: cf0cbc965fedb84a62edce8203ba049b9fd7b82e
          path: rumiai-dev-PoCs

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: fde0ae399da0994e19ff7657605017f809b8fe8e
          path: rumiai-os

      - name: Run PoC 024
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/024-mk-recursive-watch-trigger/tests/run.js
