name: PoC 068 first-party image transport check
on:
  push:
    paths:
      - .github/workflows/poc-068-first-party-image-network-check.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare trusted first-party image access
        run: |
          set -eu
          url='https://chatgpt.com/images/ecosystem/apps/github/icon.png'
          node --input-type=module <<'NODE'
          const u='https://chatgpt.com/images/ecosystem/apps/github/icon.png';
          for(const headers of [undefined,
            {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'}]){
            try{
              const r=await fetch(u,{redirect:'error',headers,signal:AbortSignal.timeout(12000)});
              console.log('node status',r.status,'type',r.headers.get('content-type'),'bytes',r.headers.get('content-length'));
              if(r.ok)console.log('node bytes',(await r.arrayBuffer()).byteLength);
            }catch(e){console.log('node transport error',e.constructor.name)}
          }
          NODE
          curl -sSL --max-time 15 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'             -o /tmp/poc068-icon -w 'curl status=%{http_code} mime=%{content_type} bytes=%{size_download}\n' "$url" || true
          file /tmp/poc068-icon || true
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --dump-dom "$url" 2>/dev/null | head -c 250 || true
