name: mk shared inputs real resolver poc

on:
  push:
    paths:
      - '.github/workflows/mk-shared-inputs-real-resolver-poc.yml'
  workflow_dispatch:

jobs:
  poc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: b1d5c89ec6642d529e71fd9eec82cfe21df1a07c
          path: rumiai-dev-PoCs
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: f2747e16560d0fbbe1cc0fe6e4d5c6c836ef041b
          path: rumiai-os
      - name: Normalize target origin
        shell: sh
        run: git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Run PoC 023
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/023-mk-shared-inputs-real-resolver/tests/run.js
