name: mk public watch baseline PoC

on:
  push:
    paths:
      - '.github/workflows/mk-public-watch-baseline-poc.yml'
  workflow_dispatch:

jobs:
  poc028:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: 83843dfbd7b93a6b68274a31ddcc0298eaa5b029
          path: rumiai-dev-PoCs

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c2d8d4a0c4503e1de461e72840a13abb0da61c41
          path: rumiai-os

      - name: Run PoC 028
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/028-mk-public-watch-baseline/tests/run.js
