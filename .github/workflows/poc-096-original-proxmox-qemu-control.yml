name: PoC 096 negative control unmodified remote original PVE EFI via QEMU

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-096-original-proxmox-qemu-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-official-iso-efi-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install authentic QEMU HTTPS and OVMF without any virtual ISO overlay
        shell: sh
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils qemu-block-extra ovmf
          qemu-system-x86_64 --version
          mkdir -p m05-control
          timeout 90 qemu-img info --output=json -f raw \
            https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso \
            > m05-control/original-info.json
          python3 - <<'PY'
          import json
          x=json.load(open('m05-control/original-info.json'))
          assert x['virtual-size']==1706178560 and x['format']=='raw'
          print('M05_QEMU_DIRECT_OFFICIAL_ORIGINAL_ISO_LENGTH_CONFIRMED')
          PY
      - name: Start genuine vendor El Torito EFI from strictly unmodified remote ISO
        shell: bash
        run: |
          set -euo pipefail
          code=
          vars=
          for dir in /usr/share/OVMF /usr/share/edk2/ovmf; do
            for suffix in _4M ''; do
              if [[ -s "$dir/OVMF_CODE$suffix.fd" && -s "$dir/OVMF_VARS$suffix.fd" ]]; then
                code="$dir/OVMF_CODE$suffix.fd"
                vars="$dir/OVMF_VARS$suffix.fd"
                break 2
              fi
            done
          done
          [[ -n "$code" && -n "$vars" ]] || { echo M05_CONTROL_OVMF_MISSING >&2; exit 2; }
          cp "$vars" m05-control/ovmf-vars-only-guest.fd
          set +e
          timeout --signal=TERM --kill-after=5 150 qemu-system-x86_64 \
            -machine q35,accel=tcg -m 2048 -smp 2 -no-reboot \
            -display none -serial mon:stdio -net none \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=m05-control/ovmf-vars-only-guest.fd" \
            -device ich9-ahci,id=ahci \
            -drive "if=none,id=iso,format=raw,media=cdrom,readonly=on,file=https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso" \
            -device ide-cd,drive=iso,bus=ahci.0,bootindex=1 \
            > m05-control/remote-official-efi-serial.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > m05-control/qemu-status.txt
          echo "M05_QEMU_DIRECT_OFFICIAL_ISO_EXIT=$status"
          grep -E 'BdsDxe|grub|Boot0001|Proxmox|Kernel panic|ISO|signal|segfault' \
            m05-control/remote-official-efi-serial.log | tail -n 45 || :
          if [[ "$status" -eq 139 ]]; then
            echo M05_UNMODIFIED_REMOTE_ORIGINAL_PVE_EFI_QEMU_SEGFAULT_REPRODUCED
          elif [[ "$status" -eq 124 ]]; then
            echo M05_UNMODIFIED_REMOTE_ORIGINAL_PVE_EFI_RUNNING_AT_TIMEOUT
          elif [[ "$status" -eq 0 ]]; then
            echo M05_UNMODIFIED_REMOTE_ORIGINAL_PVE_EFI_EXIT_ZERO
          else
            echo M05_CONTROL_QEMU_UNCLASSIFIED_EXIT >&2
            tail -n 50 m05-control/remote-official-efi-serial.log >&2
            exit 7
          fi
          echo M05_CONTROL_ONLY_NOT_M05_VENDOR_ACCEPTANCE
      - name: Preserve exact direct-original negative-control console and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-096-m05-original-proxmox-efi-unmodified-control
          retention-days: 14
          if-no-files-found: warn
          path: |
            m05-control/original-info.json
            m05-control/remote-official-efi-serial.log
            m05-control/qemu-status.txt
