name: DBeaver pkg-analyze PoC

# Dynamic probe explicitly authorized by the user on 2026-09-09.
on:
  push:
    paths:
      - .github/workflows/dbeaver-pkg-analyze.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout RumiAI OS
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: b02965a91efdeb8f9609b432d635430ac9dba209
          path: rumiai-os

      - name: Download and verify DBeaver
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/dbeaver-ce-26.2.0-linux-x86_64.tar.gz"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$artifact" \
            https://github.com/dbeaver/dbeaver/releases/download/26.2.0/dbeaver-ce-26.2.0-linux-x86_64.tar.gz
          printf '%s  %s\n' \
            f504e70a74763aa02e0b63d6842b85ca64526f682be457b3f30e330cc10748ed \
            "$artifact" | sha256sum -c -

      - name: Discover DBeaver candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/rumiai-os"
          artifact="$RUNNER_TEMP/dbeaver-ce-26.2.0-linux-x86_64.tar.gz"
          original_home="$RUNNER_TEMP/original-home"
          mkdir -p "$original_home"
          export PATH="$root:$root/bin/sys:$PATH"
          export HOME="$original_home"

          printf '\n' | "$root/bin/sys/pkg-analyze" tar.gz "$artifact" \
            > "$GITHUB_WORKSPACE/discovery.txt" \
            2> "$GITHUB_WORKSPACE/discovery.stderr"

          candidate_id="$(awk -F '\t' '$2 == "executable" && $3 == "dbeaver" { print $1; exit }' "$GITHUB_WORKSPACE/discovery.txt")"
          test -n "$candidate_id"
          printf '%s\n' "$candidate_id" > "$GITHUB_WORKSPACE/dbeaver-candidate-id.txt"

          echo '--- discovery report ---'
          cat "$GITHUB_WORKSPACE/discovery.txt"
          echo '--- discovery diagnostics ---'
          cat "$GITHUB_WORKSPACE/discovery.stderr"
          echo "selected candidate id: $candidate_id"

      - name: Probe DBeaver candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/rumiai-os"
          artifact="$RUNNER_TEMP/dbeaver-ce-26.2.0-linux-x86_64.tar.gz"
          original_home="$RUNNER_TEMP/original-home"
          candidate_id="$(cat "$GITHUB_WORKSPACE/dbeaver-candidate-id.txt")"
          export PATH="$root:$root/bin/sys:$PATH"
          export HOME="$original_home"

          command -v xvfb-run >/dev/null

          (
            sleep 20
            pkill -TERM -x dbeaver 2>/dev/null || true
            sleep 5
            pkill -KILL -x dbeaver 2>/dev/null || true
          ) &
          killer_pid=$!

          set +e
          printf '%s\ny\n\n' "$candidate_id" | \
            timeout 55s xvfb-run -a "$root/bin/sys/pkg-analyze" tar.gz "$artifact" \
              > "$GITHUB_WORKSPACE/probe.txt" \
              2> "$GITHUB_WORKSPACE/probe.stderr"
          probe_status=$?
          set -e

          kill "$killer_pid" 2>/dev/null || true
          wait "$killer_pid" 2>/dev/null || true

          printf '%s\n' "$probe_status" > "$GITHUB_WORKSPACE/probe-status.txt"
          echo '--- dynamic probe report ---'
          cat "$GITHUB_WORKSPACE/probe.txt"
          echo '--- dynamic probe diagnostics ---'
          cat "$GITHUB_WORKSPACE/probe.stderr"
          echo "pkg-analyze exit status: $probe_status"

          test "$probe_status" -eq 0

      - name: Upload PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbeaver-pkg-analyze-evidence
          path: |
            discovery.txt
            discovery.stderr
            dbeaver-candidate-id.txt
            probe.txt
            probe.stderr
            probe-status.txt
          if-no-files-found: warn
