name: poc-033-mk-shared-artifact-reclamation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/poc-033-mk-shared-artifact-reclamation.yml
      - pocs/033-mk-shared-artifact-reclamation/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclamation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout PoC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rumiai-dev-PoCs

      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c3c51e6f070c774c103eeb7f71c759e3ebfda4ec
          path: rumiai-os

      - name: Run PoC 033
        env:
          RUMIAI_POC_RUMIAI_OS: ${{ github.workspace }}/rumiai-os
        run: node rumiai-dev-PoCs/pocs/033-mk-shared-artifact-reclamation/tests/run.js
