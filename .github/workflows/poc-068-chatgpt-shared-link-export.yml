name: PoC 068 ChatGPT shared link export

on:
  push:
    paths:
      - "pocs/068-chatgpt-shared-link-export/**"
      - ".github/workflows/poc-068-chatgpt-shared-link-export.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: pocs/068-chatgpt-shared-link-export
        run: npm install --no-audit --no-fund
      - name: Syntax
        working-directory: pocs/068-chatgpt-shared-link-export
        run: npm run check
      - name: Extractor fixtures
        working-directory: pocs/068-chatgpt-shared-link-export
        run: npm test
