name: PoC 063 - large text engine

on:
  push:
    paths:
      - 'pocs/063-large-text-engine/**'
      - '.github/workflows/poc-063-editor-core.yml'
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real isolated document and transaction checks
        working-directory: pocs/063-large-text-engine
        run: node tests/run.mjs
      - name: Source-path clipboard characterization (not native GUI)
        working-directory: pocs/063-large-text-engine
        run: node tests/clipboard-paths.mjs
      - name: Short real heap and compaction smoke tests (no performance assertions)
        working-directory: pocs/063-large-text-engine
        run: |
          node --expose-gc tests/history-memory.mjs piece history 2000 2 mixed
          node --expose-gc tests/compaction.mjs 2000 history
      - name: Compare incremental pieces and compact undo correctness
        working-directory: pocs/063-large-text-engine
        run: node tests/variants.mjs
      - name: Compare bounded experimental memory workloads
        working-directory: pocs/063-large-text-engine
        run: |
          node --expose-gc tests/compare-memory.mjs piece original append 3000 2
          node --expose-gc tests/compare-memory.mjs chunked compact append 3000 2
          node --expose-gc tests/compare-memory.mjs chunked compact mixed 3000 2
      - name: Adaptive distributed-edit and file journal behavioral checks
        working-directory: pocs/063-large-text-engine
        run: node tests/repack-journal.mjs
      - name: Bounded memory/journal smoke comparison
        working-directory: pocs/063-large-text-engine
        run: |
          node --expose-gc tests/repack-memory.mjs chunked array mixed 3000 2
          node --expose-gc tests/repack-memory.mjs adaptive array mixed 3000 2
          node --expose-gc tests/repack-memory.mjs adaptive disk mixed 3000 2
      - name: Generic async history with service and Node file adapters
        working-directory: pocs/063-large-text-engine
        run: node tests/async-adapter.mjs
      - name: Exploratory editing performance, no threshold claim
        working-directory: pocs/063-large-text-engine
        run: node --expose-gc benchmark.mjs 1 8
