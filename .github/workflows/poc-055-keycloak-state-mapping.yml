name: PoC 055 Keycloak state mapping

on:
  push:
    paths:
      - .github/workflows/poc-055-keycloak-state-mapping.yml
      - pocs/055-keycloak-state-mapping/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PoC
        uses: actions/checkout@v4
        with:
          path: rumiai-dev-PoCs

      - name: Checkout RumiAI OS
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 6f8633f3cce9b9f4ebba9430622264d3fbe5031c
          path: rumiai-os

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download and verify Keycloak 26.7.3
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/keycloak-26.7.3.tar.gz"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$artifact" \
            https://github.com/keycloak/keycloak/releases/download/26.7.3/keycloak-26.7.3.tar.gz
          printf '%s  %s\n' \
            77657f30b7e90d70f727712ce1c967f430fd6a5e9f458d32d8c6df0635345f47 \
            "$artifact" | sha256sum -c -
          printf '%s\n' "$artifact" > "$GITHUB_WORKSPACE/keycloak-artifact.txt"

      - name: Run upstream Keycloak state probes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x rumiai-dev-PoCs/pocs/055-keycloak-state-mapping/tests/run.sh
          ROOT="$GITHUB_WORKSPACE/rumiai-os" \
          ARTIFACT="$(cat "$GITHUB_WORKSPACE/keycloak-artifact.txt")" \
          OUT="$GITHUB_WORKSPACE/evidence" \
            rumiai-dev-PoCs/pocs/055-keycloak-state-mapping/tests/run.sh

      - name: Upload compact upstream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-055-keycloak-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence
            !evidence/*/root/**
          if-no-files-found: warn

  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PoC
        uses: actions/checkout@v4
        with:
          path: rumiai-dev-PoCs

      - name: Checkout current RumiAI OS revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 6f8633f3cce9b9f4ebba9430622264d3fbe5031c
          path: rumiai-os

      - name: Validate integrated package state routing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x rumiai-dev-PoCs/pocs/055-keycloak-state-mapping/tests/integrated.sh
          ROOT="$GITHUB_WORKSPACE/rumiai-os" \
          OUT="$GITHUB_WORKSPACE/integrated-evidence" \
            rumiai-dev-PoCs/pocs/055-keycloak-state-mapping/tests/integrated.sh

      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-055-keycloak-integrated-${{ github.run_id }}-${{ github.run_attempt }}
          path: integrated-evidence
          if-no-files-found: warn
