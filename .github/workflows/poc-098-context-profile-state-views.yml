name: PoC 098 context profile filesystem routing

on:
  push:
    branches: [context-c2-profile-state-views]
    paths:
      - 'pocs/098-context-profile-state-views/**'
      - '.github/workflows/poc-098-context-profile-state-views.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-var-routing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise POSIX shared and profile-specific symlink paths
        shell: sh
        run: |
          set -eu
          script=pocs/098-context-profile-state-views/tests/profile-var-routing.sh
          sh -n "$script"
          sh "$script"

  integrated-catalog-var-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact existing m implementation
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 1e3a038a5abf6f8c176272d8e44464c842d3cefd
          path: m-source
          persist-credentials: false
      - name: Checkout exact real catalog descriptor
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: a75f9be1c9a62a72899022eddf55e163d86ab630
          path: catalog
          persist-credentials: false
      - name: Integrate genuine catalog var metadata with staged disposable payload
        shell: sh
        run: |
          set -eu
          [ "$(git -C m-source rev-parse HEAD)" = 1e3a038a5abf6f8c176272d8e44464c842d3cefd ]
          [ "$(git -C catalog rev-parse HEAD)" = a75f9be1c9a62a72899022eddf55e163d86ab630 ]
          script="$PWD/pocs/098-context-profile-state-views/tests/integrated-catalog-var-routing.sh"
          descriptor="$PWD/catalog/v1/pkg/geoserver/all/n0001=3.0.1/var/data"
          sh -n "$script"
          ./m-source/m sh "$script" "$descriptor"
