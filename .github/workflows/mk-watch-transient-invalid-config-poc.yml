name: mk transient invalid watch config PoC

on:
  push:
    paths:
      - '.github/workflows/mk-watch-transient-invalid-config-poc.yml'
  workflow_dispatch:

jobs:
  poc025:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: cc1187af9bbce3b03602f3be470410cb09248ce7
          path: rumiai-dev-PoCs

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 92f0d459225ee4117f3c2cb32aa1b8aa9f17ec90
          path: rumiai-os

      - name: Run PoC 025
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/025-mk-watch-transient-invalid-config/tests/run.js
