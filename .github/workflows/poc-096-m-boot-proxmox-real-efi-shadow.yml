name: PoC 096 original PVE EFI GRUB virtual shadow on QEMU remote official ISO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-096-m-boot-proxmox-real-efi-shadow.yml'
      - 'pocs/096-m-boot-proxmox-real-efi-virtual-shadow/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-pve-efi-grub-cow:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU remote HTTPS block and disposable EFI/CPIO support
        shell: sh
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-utils qemu-block-extra qemu-system-x86 ovmf \
            grub-common dosfstools mtools cpio fakeroot initramfs-tools-core zstd
          python3 -m py_compile pocs/095-m-boot-proxmox-vendor-grub-shadow/inspect-shadow.py
          python3 -m py_compile pocs/096-m-boot-proxmox-real-efi-virtual-shadow/verify-qemu-cow.py
          sh -n pocs/096-m-boot-proxmox-real-efi-virtual-shadow/prepare-qemu-cow.sh
          qemu-io -c 'help write' 2>&1 | grep -F -- '-s'
      - name: Recheck official original GRUB config and derive exact 3-sector virtual payload
        shell: sh
        run: |
          set -eu
          python3 pocs/095-m-boot-proxmox-vendor-grub-shadow/inspect-shadow.py --out m05-source
          grub-script-check m05-source/virtual-grub.cfg
      - name: Create bounded COW with ORIGINAL upstream ISO as read-only HTTPS backing
        shell: sh
        run: |
          set -eu
          sh pocs/096-m-boot-proxmox-real-efi-virtual-shadow/prepare-qemu-cow.sh \
            m05-source m05-cow
          python3 pocs/096-m-boot-proxmox-real-efi-virtual-shadow/verify-qemu-cow.py \
            --config m05-source --qemu m05-cow --out m05-cow/verified-sector-report.json
          echo M05_ORIGINAL_VENDOR_ISO_THREE_LOGICAL_SOURCE_PATCHES_PASS
      - name: Reuse original Proxmox initrd for independent small external CPIO only
        shell: sh
        run: |
          set -eu
          python3 pocs/083-m-boot-truenas-initrd-readonly/extract_initrd_range.py \
            --url https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso \
            --source-sha256 4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c \
            --target BOOT/INITRD.IMG --expect-bytes 55878409 \
            --output m05-cow/vendor-initrd.img --manifest m05-cow/initrd-range.json
          echo '8fdf76b44287af130358c142f1743c30e1b10df21bae1693283736603bef3cba  m05-cow/vendor-initrd.img' | sha256sum --check
          sh pocs/085-vendor-initrd-cpio-boot/make_append_only_probe.sh \
            m05-cow/vendor-initrd.img m05-cow/hook
          test "$(wc -c < m05-cow/hook/append-only-hook.cpio)" -le 65536
      - name: Create isolated additional FAT16 firmware-visible disk for GRUB sidecar
        shell: sh
        run: |
          set -eu
          truncate -s 32M m05-cow/m05-stage-fat.img
          mkfs.vfat -F 16 m05-cow/m05-stage-fat.img
          printf 'poc-096-isolated-efi-initrd-sidecar\n' > m05-cow/m05-probe.marker
          mcopy -i m05-cow/m05-stage-fat.img m05-cow/m05-probe.marker ::/m05-probe.marker
          mcopy -i m05-cow/m05-stage-fat.img m05-cow/hook/append-only-hook.cpio ::/m05-probe.cpio
          mdir -i m05-cow/m05-stage-fat.img ::/
          sha256sum m05-cow/m05-stage-fat.img > m05-cow/sidecar-fat-sha256-before.txt
          sha256sum m05-cow/official-iso-readonly-guest-shadow.qcow2 > m05-cow/qcow2-sha256-before.txt
      - name: Boot the ORIGINAL vendor El Torito EFI loader on remote original ISO source shadow
        shell: bash
        run: |
          set -euo pipefail
          code=
          vars=
          for dir in /usr/share/OVMF /usr/share/edk2/ovmf; do
            for suffix in _4M ''; do
              if [[ -s "$dir/OVMF_CODE$suffix.fd" && -s "$dir/OVMF_VARS$suffix.fd" ]]; then
                code="$dir/OVMF_CODE$suffix.fd"
                vars="$dir/OVMF_VARS$suffix.fd"
                break 2
              fi
            done
          done
          [[ -n "$code" && -n "$vars" ]] || { echo M05_VENDOR_EFI_FIRMWARE_FILES_ABSENT >&2; exit 2; }
          cp "$vars" m05-cow/ovmf-vars-disposable.fd
          set +e
          timeout --signal=TERM --kill-after=5 300 qemu-system-x86_64 \
            -machine q35,accel=tcg -m 2048 -smp 2 -no-reboot \
            -display none -serial mon:stdio -net none \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=m05-cow/ovmf-vars-disposable.fd" \
            -device ich9-ahci,id=ahci \
            -drive "if=none,id=iso,format=qcow2,media=cdrom,readonly=on,file=m05-cow/official-iso-readonly-guest-shadow.qcow2" \
            -device ide-cd,drive=iso,bus=ahci.0,bootindex=1 \
            -drive "if=none,id=sidecar,format=raw,snapshot=on,file=m05-cow/m05-stage-fat.img" \
            -device ide-hd,drive=sidecar,bus=ahci.1,bootindex=9 \
            > m05-cow/original-vendor-efi-serial.log 2>&1
          status=$?
          set -e
          echo "M05_VENDOR_EFI_QEMU_EXIT=$status"
          grep -E 'M05_|VT085_|searching for block|no device with valid ISO|ISO found|Kernel panic|Initramfs unpacking' \
            m05-cow/original-vendor-efi-serial.log | tail -n 90 || :
          if ! grep -Fq M05_EXTERNAL_SIDECAR_GRUB_FOUND m05-cow/original-vendor-efi-serial.log; then
            echo M05_ORIGINAL_VENDOR_EFI_DID_NOT_PROVE_SHADOW_REACH >&2
            tail -n 105 m05-cow/original-vendor-efi-serial.log >&2
            exit 8
          fi
          echo M05_ORIGINAL_VENDOR_INNER_EFI_GRUB_EXECUTED_VIRTUAL_CONFIG_PASS
          if grep -Fq VT085_EXEC_ORIGINAL_VENDOR_INIT m05-cow/original-vendor-efi-serial.log; then
            echo M05_ORIGINAL_VENDOR_INIT_EXECUTED_EXTERNAL_CPIO_PASS
          else
            echo M05_ORIGINAL_VENDOR_INIT_EXTERNAL_CPIO_UNOBSERVED_ON_SERIAL
          fi
          if grep -q 'no device with valid ISO found' m05-cow/original-vendor-efi-serial.log; then
            echo M05_VENDOR_MEDIA_REJECTED_OR_MEDIA_MISSING
          else
            echo M05_VENDOR_MEDIA_ID_ACCEPTANCE_NOT_PROVEN
          fi
          sha256sum --check --status m05-cow/sidecar-fat-sha256-before.txt
          sha256sum --check --status m05-cow/qcow2-sha256-before.txt
          echo M05_GUEST_SOURCE_AND_EXPERIMENTAL_SHADOW_UNCHANGED_AFTER_BOOT
      - name: Publish bounded run metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-096-m05-original-pve-efi-source-shadow
          retention-days: 14
          if-no-files-found: warn
          path: |
            m05-source/report.json
            m05-source/original-grub.cfg
            m05-source/virtual-grub.cfg
            m05-cow/qemu-info.json
            m05-cow/verified-sector-report.json
            m05-cow/create.log
            m05-cow/resize.log
            m05-cow/write-pvd.log
            m05-cow/write-dirent.log
            m05-cow/write-virtual-config.log
            m05-cow/initrd-range.json
            m05-cow/hook/sha256sums.txt
            m05-cow/sidecar-fat-sha256-before.txt
            m05-cow/qcow2-sha256-before.txt
            m05-cow/original-vendor-efi-serial.log
