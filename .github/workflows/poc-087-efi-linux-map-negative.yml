name: PoC 087 reject malformed EFI Linux handoff variables

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-087-efi-linux-map-negative.yml'
      - 'pocs/087-m-boot-efi-linux-middleware/**'
  pull_request:
    paths:
      - '.github/workflows/poc-087-efi-linux-map-negative.yml'
      - 'pocs/087-m-boot-efi-linux-middleware/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-original-consumer-rejections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the PoC test (no USB, no ISO)
        uses: actions/checkout@v4
        with:
          path: poc-repo
          persist-credentials: false
      - name: Check out the unchanged experimental Linux EFI consumer
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/Ventoy
          ref: 01e0398315c42442cb358ee25f80c7c2fc2df68f
          path: fork
          persist-credentials: false
      - name: Assert exact source revision and compile the real consumer
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C fork rev-parse HEAD)
          test "$actual" = 01e0398315c42442cb358ee25f80c7c2fc2df68f
          gcc --version | head -n 1
          python3 -m py_compile poc-repo/pocs/087-m-boot-efi-linux-middleware/test-consumer-negative.py
          python3 poc-repo/pocs/087-m-boot-efi-linux-middleware/test-consumer-negative.py \
            fork/GRUB2/port/probe-linux-efi-consumer.c \
            | tee "$RUNNER_TEMP/vt087-negative-results.txt"
          grep -Fx 'VT087_EFI_VARIABLE_MALFORMED_REJECTION_PASS: 13 cases, real consumer' \
            "$RUNNER_TEMP/vt087-negative-results.txt"
      - name: F-02 real compiled consumer on isolated regular-file GPTs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile poc-repo/pocs/087-m-boot-efi-linux-middleware/test-consumer-disk-negative.py
          python3 poc-repo/pocs/087-m-boot-efi-linux-middleware/test-consumer-disk-negative.py \
            fork/GRUB2/port/probe-linux-efi-consumer.c \
            | tee "$RUNNER_TEMP/vt-f02-disk-negative-results.txt"
          grep -F 'VT_F02_DISPOSABLE_GPT_MAP_PASS: 21 real-consumer cases' \
            "$RUNNER_TEMP/vt-f02-disk-negative-results.txt"
      - name: Preserve bounded negative test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-087-efi-invalid-map-result
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vt087-negative-results.txt
            ${{ runner.temp }}/vt-f02-disk-negative-results.txt
