name: PoC 073 — mk package-local runtime

on:
  push:
    branches:
      - mk-package-local-runtime
    paths:
      - pocs/073-mk-package-local-runtime/**
      - .github/workflows/poc-073-mk-package-local-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkg-local-mk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: poc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 673df1a2d5476ad57d54c7bc7e1fc2deeaf16195
          path: product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m
          ref: 5c1e02a10e5300ab953d86aa677583f63e6a068d
          path: m-source
          persist-credentials: false
      - name: Validate extraction against the legacy implementation
        shell: sh
        run: sh poc/pocs/073-mk-package-local-runtime/tests/run.sh product
      - name: Validate the package against actual autonomous m
        shell: sh
        run: sh poc/pocs/073-mk-package-local-runtime/tests/run.sh m-source
      - name: Build release-candidate archive
        if: matrix.os == 'ubuntu-latest'
        shell: sh
        run: |
          sh poc/pocs/073-mk-package-local-runtime/build.sh release-candidate
          shasum -a 256 release-candidate/mk-v0.1.0.tar.gz > release-candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mk-v0.1.0-release-candidate
          path: |
            release-candidate/mk-v0.1.0.tar.gz
            release-candidate/SHA256SUMS
          if-no-files-found: error
