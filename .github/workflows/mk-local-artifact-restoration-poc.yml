name: mk local artifact restoration PoC

on:
  push:
    paths:
      - '.github/workflows/mk-local-artifact-restoration-poc.yml'
  workflow_dispatch:

jobs:
  poc030:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PoCs
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-dev-PoCs
          ref: b8bb6eadf688038436539f279c293e91165285f8
          path: rumiai-dev-PoCs

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 5f01f0bccef37020057195c98809ba492f02443c
          path: rumiai-os

      - name: Run PoC 030
        shell: sh
        run: |
          RUMIAI_POC_RUMIAI_OS="$PWD/rumiai-os"
          export RUMIAI_POC_RUMIAI_OS
          node rumiai-dev-PoCs/pocs/030-mk-local-artifact-restoration/tests/run.js
