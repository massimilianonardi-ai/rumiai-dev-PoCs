name: m-boot Ubuntu Minimal RAW host bootstrap PoC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m-boot-ubuntu-raw-host.yml'
      - 'pocs/qemu-ubuntu-raw-host/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-raw-boot-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PoC revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real GRUB script checker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends grub-common initramfs-tools-core e2fsprogs
      - name: Validate external kernel/initramfs GRUB and initramfs syntax
        shell: bash
        run: |
          set -euo pipefail
          root=pocs/qemu-ubuntu-raw-host
          sh -n "$root/build.sh"
          # Verify Ubuntu 24.04's *installed* native loop-root implementation,
          # not only its manpage or the old Wubi sources.
          test -f /usr/share/initramfs-tools/scripts/local
          grep -Fq 'LOOP' /usr/share/initramfs-tools/scripts/local
          grep -Fq 'mount -o move' /usr/share/initramfs-tools/scripts/local
          dpkg-query -W -f='MBOOT_NATIVE_LOOP_PACKAGE=${Version}\n' initramfs-tools-core
          # Create and inspect a real partitionless ext4 RAW fixture.
          truncate -s 64M "$RUNNER_TEMP/fixture-rootfs.raw"
          mkfs.ext4 -q -F -L MBOOT_ROOTFS_FIXTURE "$RUNNER_TEMP/fixture-rootfs.raw"
          test "$(blkid -p -o value -s TYPE "$RUNNER_TEMP/fixture-rootfs.raw")" = ext4
          e2fsck -fn "$RUNNER_TEMP/fixture-rootfs.raw" > "$RUNNER_TEMP/ext4-check.txt"
          # The source is a GRUB function library. Append a synthetic
          # invocation only for parser validation; this does NOT boot it.
          cp "$root/grub-example.cfg" "$RUNNER_TEMP/grub-check.cfg"
          printf '\nboot_iso_with_ubuntu_qemu_host /m/boot/iso/synthetic.iso\n' \
            >> "$RUNNER_TEMP/grub-check.cfg"
          grub-script-check "$RUNNER_TEMP/grub-check.cfg"
          python3 - "$root" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          grub=(root/'grub-example.cfg').read_text()
          builder=(root/'build.sh').read_text()
          launcher=(root/'launch.py').read_text()
          assert 'host_kernel' in grub and 'host_initrd' in grub
          assert 'loopback ubuntu_host' not in grub
          assert 'root=UUID=' in grub and 'loop="$host_image"' in grub
          assert 'loopfstype=ext4' in grub and 'mboot.iso=' in grub
          assert 'mboot.raw=' not in grub and 'mboot.media_uuid=' not in grub
          assert 'mboot.media_uuid=' not in launcher
          assert 'candidate = mountpoint / iso.relative_to("/")' in launcher
          assert 'release-SHA256SUMS' in builder
          assert 'virt-copy-out' in builder and 'guestfish --ro' in builder
          assert 'blkid -p -o value -s TYPE' in builder
          assert 'qemu-img convert -p -f qcow2 -O raw' not in builder
          assert 'update-initramfs -u -k all' in builder
          PY
          echo MBOOT_RAW_EXTERNAL_BOOT_CONTRACT_STATIC_PASS

  ubuntu-raw-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out pinned PoC revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real QEMU and libguestfs image customizer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-utils libguestfs-tools libguestfs0 linux-image-generic zstd curl \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
          # libguestfs 1.52 tries passt preferentially, but its nested helper
          # cannot start on this GitHub-hosted runner. Force supported SLIRP
          # fallback only inside this disposable CI machine.
          if command -v passt >/dev/null 2>&1; then
            sudo mv "$(command -v passt)" "$(command -v passt).disabled-in-ci"
          fi
      - name: Check launcher and generate read-only synthetic disk plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pocs/qemu-ubuntu-raw-host/launch.py
          sh -n pocs/qemu-ubuntu-raw-host/build.sh
          truncate -s 4M "$RUNNER_TEMP/synthetic-source.iso"
          truncate -s 8M "$RUNNER_TEMP/synthetic-physical-a.raw"
          truncate -s 8M "$RUNNER_TEMP/synthetic-physical-b.raw"
          sha256sum "$RUNNER_TEMP"/synthetic-* > "$RUNNER_TEMP/fixture-hashes.txt"
          printf 'root=LABEL=test mboot.iso=%s\n' "$RUNNER_TEMP/synthetic-source.iso" \
            > "$RUNNER_TEMP/cmdline"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          data = [{"path": str(root / f"synthetic-physical-{x}.raw"), "size": 8388608}
                  for x in ("a", "b")]
          (root / "fixture-disks.json").write_text(json.dumps(data))
          PY
          python3 pocs/qemu-ubuntu-raw-host/launch.py \
            --cmdline-file "$RUNNER_TEMP/cmdline" \
            --fixture-disks "$RUNNER_TEMP/fixture-disks.json" \
            > "$RUNNER_TEMP/read-only-plan.json"
          python3 - "$RUNNER_TEMP/read-only-plan.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["physical_disks_exposed_readonly"] == 2
          assert data["all_disk_backends_readonly"]
          assert not data["physical_disk_write_enabled"]
          command = data["command"]
          blocks = [command[i + 1] for i, arg in enumerate(command[:-1])
                    if arg == "-blockdev"]
          assert len(blocks) == 4, blocks
          assert all("read-only=on" in block for block in blocks)
          assert sum("node-name=physical" in block for block in blocks) == 2
          assert data["accelerator_requested"] in ("kvm", "tcg")
          PY
          sha256sum --check "$RUNNER_TEMP/fixture-hashes.txt"
          echo MBOOT_RAW_DISK_READONLY_PLAN_PASS
          python3 -m py_compile pocs/qemu-ubuntu-raw-host/smoke.py
          template=$(python3 - "$RUNNER_TEMP/read-only-plan.json" <<'PY'
          import json, pathlib, sys
          plan=json.load(open(sys.argv[1]))
          code=plan["firmware"]
          if "CODE" in code:
              path=code.replace("CODE", "VARS")
              assert pathlib.Path(path).is_file(), path
              print(path)
          else:
              print("-")
          PY
          )
          python3 pocs/qemu-ubuntu-raw-host/smoke.py \
            "$RUNNER_TEMP/read-only-plan.json" \
            "$RUNNER_TEMP/vars/ovmf-vars.fd" "$template" \
            > "$RUNNER_TEMP/paused-qemu-smoke.json"
          cat "$RUNNER_TEMP/paused-qemu-smoke.json"
          echo MBOOT_NATIVE_QEMU_READONLY_SMOKE_PASS
      - name: Build official-verified Ubuntu Minimal RAW container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sh pocs/qemu-ubuntu-raw-host/build.sh \
            "$RUNNER_TEMP/mboot-ubuntu-${{ matrix.arch }}"
          qemu-img info -f raw "$RUNNER_TEMP/mboot-ubuntu-${{ matrix.arch }}/mboot-ubuntu-host.raw"
          grep -F 'file format: raw' \
            "$RUNNER_TEMP/mboot-ubuntu-${{ matrix.arch }}/raw-info.txt"
          test "$(blkid -p -o value -s TYPE "$RUNNER_TEMP/mboot-ubuntu-${{ matrix.arch }}/mboot-ubuntu-host.raw")" = ext4
          (
            cd "$RUNNER_TEMP/mboot-ubuntu-${{ matrix.arch }}"
            sha256sum -c release-SHA256SUMS
            test -s vmlinuz
            test -s initrd.img
            test -s kernel-release.txt
            grep -F 'scripts/local' initramfs-contents.txt
          )
          echo MBOOT_UBUNTU_EXT4_ROOTFS_AND_SIDECARS_PASS
      - name: Preserve build evidence and actual RAW container
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mboot-ubuntu-minimal-raw-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
          path: |
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/mboot-ubuntu-host.raw.zst
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/vmlinuz
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/initrd.img
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/kernel-release.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/release-SHA256SUMS
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/initramfs-contents.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/boot-export.log
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/root-filesystems.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/export-ext4.log
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/e2fsck.log
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/raw-sha256.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/raw-info.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/provenance.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/source-verify.txt
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/virt-resize.log
            ${{ runner.temp }}/mboot-ubuntu-${{ matrix.arch }}/virt-customize.log
            ${{ runner.temp }}/read-only-plan.json
            ${{ runner.temp }}/paused-qemu-smoke.json
